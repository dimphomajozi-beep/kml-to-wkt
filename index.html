<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KML to WKT Converter</title>
  <!-- Load libraries directly from CDN -->
  <script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
  <script src="https://unpkg.com/wellknown@0.5.0/wellknown.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    textarea { width: 100%; height: 180px; margin-top: 10px; font-family: monospace; }
    button { padding: 10px 20px; font-size: 16px; margin: 15px 0; cursor: pointer; }
  </style>
</head>
<body>
  <h2>KML to WKT Converter</h2>
  <label>Paste KML content or upload a file:</label><br>
  <input type="file" id="fileInput" accept=".kml"><br>
  <textarea id="kmlInput" placeholder="Paste <kml>...</kml> here"></textarea><br>

  <button onclick="convertKML()">Convert to WKT</button>

  <h3>WKT Output:</h3>
  <textarea id="wktOutput" readonly></textarea>

  <script>
    // Handle file upload
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        document.getElementById('kmlInput').value = event.target.result;
      };
      reader.readAsText(file);
    });

    // Convert KML to WKT and strip 3D altitude zeros
    function convertKML() {
      const kmlText = document.getElementById('kmlInput').value;
      if (!kmlText.trim()) return alert("Please provide KML input.");

      try {
        const parser = new DOMParser();
        const kmlDom = parser.parseFromString(kmlText, "text/xml");
        const geojson = toGeoJSON.kml(kmlDom);

        if (!geojson.features || geojson.features.length === 0) {
          return alert("No valid features found in KML.");
        }

        const wktResults = geojson.features.map(f => {
          let wkt = wellknown.stringify(f.geometry);
          // Strip trailing 3D ' 0' altitude values so 2D viewers can parse it
          wkt = wkt.replace(/\s+0(?=[,\)])/g, '');
          return wkt;
        });

        document.getElementById('wktOutput').value = wktResults.join("\n\n");
      } catch (err) {
        alert("Error converting KML: " + err.message);
      }
    }
  </script>
</body>
</html>
